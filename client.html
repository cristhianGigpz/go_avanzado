<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket Client</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 600px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 15px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            gap: 8px;
            display: flex;
            align-items: center;
        }

        .status.connected {
            background-color: #d4edda;
            color: #155724;
        }

        .status.disconnected {
            background-color: #f8d7da;
            color: #721c24;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .status.connected .status-dot {
            background-color: #28a745;
            animation: pulse 2s infinite;
        }

        .status.disconnected .status-dot {
            background-color: #dc3545;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .messages {
            background-color: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.sent {
            background-color: #667eea;
            color: white;
            align-self: flex-end;
            max-width: 80%;
            word-break: break-word;
        }

        .message.received {
            background-color: #e9ecef;
            color: #333;
            align-self: flex-start;
            max-width: 80%;
            word-break: break-word;
        }

        .message.system {
            background-color: #fff3cd;
            color: #856404;
            align-self: center;
            font-size: 12px;
            max-width: 90%;
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        input:disabled {
            background-color: #f5f5f5;
            color: #ccc;
            cursor: not-allowed;
        }

        button {
            padding: 12px 24px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover:not(:disabled) {
            background-color: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .info {
            background-color: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 12px 15px;
            border-radius: 4px;
            font-size: 13px;
            color: #0c5aa0;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>WebSocket Client</h1>
            <div class="status disconnected" id="status">
                <span class="status-dot"></span>
                <span id="statusText">Desconectado</span>
            </div>
        </div>

        <div class="info">
            Conectando a: <strong>ws://localhost:8080/ws</strong>
        </div>

        <div class="messages" id="messages"></div>

        <div class="input-area">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Escribe un mensaje..." 
                disabled
            >
            <button id="sendBtn" disabled>Enviar</button>
        </div>
    </div>

    <script>
        let ws = null;
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const messagesContainer = document.getElementById('messages');
        const statusElement = document.getElementById('status');
        const statusText = document.getElementById('statusText');
        uuid = crypto.randomUUID().substring(0, 8);

        function addMessage(payload, type = 'received') {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            if (payload && typeof payload === 'object' && !Array.isArray(payload)) {
                const username = payload.username || 'Sistema';
                const message = payload.message || '';

                const sender = document.createElement('strong');
                sender.textContent = `${username}: `;

                const content = document.createElement('span');
                content.textContent = message;

                messageDiv.appendChild(sender);
                messageDiv.appendChild(content);
            } else {
                messageDiv.textContent = payload;
            }

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateStatus(connected) {
            if (connected) {
                statusElement.classList.remove('disconnected');
                statusElement.classList.add('connected');
                statusText.textContent = 'Conectado';
                messageInput.disabled = false;
                sendBtn.disabled = false;
            } else {
                statusElement.classList.remove('connected');
                statusElement.classList.add('disconnected');
                statusText.textContent = 'Desconectado';
                messageInput.disabled = true;
                sendBtn.disabled = true;
            }
        }

        function connectWebSocket() {
            try {
                ws = new WebSocket('ws://localhost:8080/ws');
                //const socket = new WebSocket("ws://localhost:8080/ws?token=JWT")

                ws.onopen = () => {
                    addMessage('Conectado al servidor', 'system');
                    updateStatus(true);
                };

                ws.onmessage = (event) => {
                    try {
                        const parsedMessage = JSON.parse(event.data);
                        addMessage(parsedMessage, 'received');
                    } catch (error) {
                        addMessage(event.data, 'received');
                    }
                };

                ws.onerror = (error) => {
                    addMessage(`Error: ${error.message}`, 'system');
                    updateStatus(false);
                };

                ws.onclose = () => {
                    addMessage('Desconectado del servidor', 'system');
                    updateStatus(false);
                    // Intentar reconectar después de 3 segundos
                    setTimeout(connectWebSocket, 3000);
                };
            } catch (error) {
                addMessage(`Error de conexión: ${error.message}`, 'system');
                updateStatus(false);
            }
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message) return;
             // Generar un UUID corto para el usuario
            if (ws && ws.readyState === WebSocket.OPEN) {
                const payload = {
                    username: 'Usuario: ' + uuid,
                    message: message
                };

                ws.send(JSON.stringify(payload));
                messageInput.value = '';
                messageInput.focus();
            } else {
                addMessage('No estás conectado al servidor', 'system');
            }
        }

        // Eventos
        sendBtn.addEventListener('click', sendMessage);

        messageInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                sendMessage();
            }
        });

        // Conectar al cargar la página
        connectWebSocket();
    </script>
</body>
</html>
